apiVersion: v1
kind: Pod
metadata:
  name: step-response
  namespace: tdk-measurement
spec:
  nodeSelector:
    kubernetes.io/hostname: node2
  containers:
  - name: reader
    image: ubuntu:24.04
    command: ["/bin/bash", "-c", "sleep infinity"]
    securityContext:
      privileged: true
    volumeMounts:
    - name: sys
      mountPath: /host/sys
      readOnly: true
  volumes:
  - name: sys
    hostPath:
      path: /sys
  restartPolicy: Never
