apiVersion: apps/v1
kind: Deployment
metadata:
  name: vegeta
  namespace: tdk-measurement
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vegeta
  template:
    metadata:
      labels:
        app: vegeta
    spec:
      nodeSelector:
        kubernetes.io/hostname: node6
      containers:
      - name: vegeta
        image: ubuntu:24.04
        command: ["/bin/bash", "-c", "apt-get update && apt-get install -y wget && wget -qO- https://github.com/tsenart/vegeta/releases/download/v12.12.0/vegeta_12.12.0_linux_amd64.tar.gz | tar xz -C /usr/local/bin vegeta && sleep infinity"]
